[project]
name = "gfactor-bench"
version = "0.1.0"
description = "IQ-style psychometric test for AI models: general factor, skill factors, spread, 90% intervals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "litellm>=1.111.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
gfb = "gfactor_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
